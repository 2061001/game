<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Flappy Bird</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        canvas {
            border: 2px solid black;
            background: skyblue;
        }
    </style>
</head>

<body>
    <h1>Flappy Bird</h1>
    <p>점수: <span id="score">0</span> | 최고기록: <span id = "highscore">0</span> </p>
    <p>조작: Space 키 또는 마우스 클릭 <button id="restartBtn"
    onclick = "restart(); this.blur();">다시 시작</button></p>
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreText = document.getElementById("score");

        let score = 0;
        let gameOver = false;
        
        const bird = {
            x:80,y:250,radius:15,velocity:0,gravity:0.3,jumpPower:-8
        };

        function drawBird(){
            ctx.beginPath();
            ctx.arc(bird.x, bird.y, bird.radius, 0,Math.PI * 2);
            ctx.fillStyle = "yellow";
            ctx.fill();

            ctx.fillStyle = "black";
            ctx.beginPath();
            ctx.arc(bird.x+5,bird.y-5,3,0,Math.PI*2);
            ctx.fill();
        }
        
        function moveBird(){
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            if(bird.y - bird.radius<0 || bird.y +bird.radius>canvas.height){
                endGame();
            }
        }

        function jump(){
            if(gameOver) return;
            bird.velocity = bird.jumpPower;
        }

        document.addEventListener("keydown",function (event){
            if(event.code === "Space"){
                jump();
            }
        })

        document.addEventListener("click",jump);


        function restart(){
            if(!gameOver) return;

            bird.y =250;
            bird.velocity = 0;

            pipes.length =0;
            score = 0;
            scoreText.textContent = 0;

            startcountdown();

            gameOver = false;
            gameLoop();

        }

        let countdown = 3;

        function startcountdown(){
            countdown = 3;
            const timer =setInterval(function (){
                countdown --;
                if (countdown<=0) clearInterval(timer);
            },1000);
        }

        const pipes =[];
        const pipeWidth =60;
        let pipeGap = 200;
        let pipeSpeed= 3;
        let pipecreate = 1500;
        function createPipe(){
            if (countdown>0) return;
            const topHeight = Math.random()*220+50;
            pipes.push({
                x:canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                passed : false
            });
        }

        function drawPipe(){
            ctx.fillStyle = "green";
            
            for (let pipe of pipes){
                ctx.fillRect(pipe.x,0,pipeWidth,pipe.topHeight);
                ctx.fillRect(pipe.x,pipe.bottomY,pipeWidth,canvas.height - pipe.bottomY);
            }
        }

        function movePipes(){
            for (let pipe of pipes){
                pipe.x -= pipeSpeed;
                if(!pipe.passed && pipe.x + pipeWidth<bird.x){
                    score ++
                    scoreText.textContent = score;
                    pipe.passed = true;
                    if(score %5 === 0){
                        pipeSpeed += 1;
                        pipeGap = Math.max(120,pipeGap - 10);
                        pipecreate = Math.max(1500,pipecreate -200);
                    }

                    updateHighscore();
                }

            }
            for(let i = pipes.length-1;i>=0;i--){
                    if(pipes[i].x + pipeWidth <0){
                        pipes.splice(i,1);
                    }
            }
        }
        function checkCollision(){
            for(let pipe of pipes){
            const birdLeft = bird.x-bird.radius;
            const birdRight = bird.x + bird.radius;
            const birdTop = bird.y - bird.radius;
            const birdBottom = bird.y + bird.radius;
            
            const pipeLeft  = pipe.x;
            const pipeRight = pipe.x + pipeWidth;
            
            const hitTopPipe = 
                birdRight>pipeLeft && birdLeft<pipeRight && birdTop<pipe.topHeight;
            
            const hitBottomPipe = 
                birdRight>pipeLeft && birdLeft<pipeRight && birdBottom >pipe.bottomY;
                
            if(hitBottomPipe || hitTopPipe){
                endGame();
            }

            }
        }

        function endGame(){
            gameOver = true;
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.font="32px Arial";
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.fillText("게임오버!",canvas.width/2,canvas.height/2-30);
            ctx.fillText("점수:"+score,canvas.width/2,canvas.height/2+20);
        }

        const highscoreText = document.getElementById("highscore");
        let highscore = Number(localStorage.getItem("flappyhighscore"))||0;
        highscoreText.textContent = highscore;

        function updateHighscore(){
            if(score > highscore){
                highscore = score;
                highscoreText.textContent = highscore;
                localStorage.setItem("flappyhighscore",highscore);
            }
        }

        function gameLoop(){
            if(gameOver) return;
            ctx.clearRect(0,0,canvas.width,canvas.height);

            if(countdown >0 ){
                drawBird();
                ctx.font="80px Arial";
                ctx.fillStyle = "white";
                ctx.textAlign = "center";
                ctx.fillText (countdown,canvas.width/2,canvas.height/2);

                requestAnimationFrame(gameLoop);
                return;
            }
            moveBird();
            movePipes();
            checkCollision();
            drawBird();
            drawPipe();
            

            requestAnimationFrame(gameLoop);
        }
        setInterval(createPipe,pipecreate);
        startcountdown();
        gameLoop();
    </script>

</body>

</html>
